<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微购相册 SCRM 总览</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: #f5f6f8;
  color: #1d1d1f;
}
.tabs {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e3e5e8;
}
.tabs .title { font-weight: 600; font-size: 14px; margin-right: 16px; }
.tab {
  appearance: none;
  border: 1px solid #d0d4da;
  background: #fff;
  color: #333;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.tab:hover { background: #f0f2f5; }
.tab.active { background: #1d6fe8; border-color: #1d6fe8; color: #fff; }
.views { flex: 1; position: relative; min-height: 0; }
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
  visibility: hidden;
  pointer-events: none;
}
iframe.active { visibility: visible; pointer-events: auto; }
</style>
</head>
<body>
<div class="tabs">
  <span class="title">微购相册 SCRM</span>
  <button class="tab" data-view="proto">核心原型</button>
  <button class="tab" data-view="flow">页面跳转图</button>
  <button class="tab" data-view="flat">原型平铺图</button>
</div>
<div class="views">
  <iframe id="proto" src="proto.html" title="核心原型"></iframe>
  <iframe id="flow" src="flow.html" title="页面跳转图"></iframe>
  <iframe id="flat" src="tiles.html" title="原型平铺图"></iframe>
</div>
<script>
(function () {
  var VIEWS = ['proto', 'flow', 'flat'];
  var tabs = document.querySelectorAll('.tab');
  var frames = document.querySelectorAll('iframe');

  function show(view) {
    if (VIEWS.indexOf(view) === -1) view = 'proto';
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.view === view); });
    frames.forEach(function (f) { f.classList.toggle('active', f.id === view); });
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { show(t.dataset.view); });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'proto');
})();
</script>
</body>
</html>
