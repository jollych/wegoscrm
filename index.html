body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:#E8EBEF;color:var(--ink);font-size:14px;line-height:1.45}

.app{display:grid;grid-template-columns:230px 410px minmax(260px,330px);gap:28px;justify-content:center;padding:24px 20px;min-height:100vh;align-items:start}

/* side panels */
.nav,.note{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
.nav h1{font-size:17px;margin-bottom:4px}
.nav .sub{color:var(--mut);font-size:12px;margin-bottom:16px}
.nav h2,.note h2{font-size:12px;color:var(--mut);font-weight:500;margin:16px 0 6px}
.nav button.i{display:flex;width:100%;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.nav button.i:hover{background:#DDE1E6}
.nav button.i.on{background:#fff;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.nav .sc{display:block;width:100%;text-align:left;padding:10px;border-radius:10px;background:#fff;margin-bottom:8px;border:1px solid transparent}
.nav .sc.on{border-color:var(--g)}
.nav .sc b{display:block;font-size:13px}
.nav .sc span{font-size:12px;color:var(--mut)}
.tg{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:500;white-space:nowrap}
.tg.new{background:var(--g2);color:#07934B}
.tg.mod{background:var(--orgbg);color:#C66A0C}
.tg.old{background:#ECEEF1;color:#6B7480}
.note{background:#fff;border-radius:14px;padding:16px}
.note h3{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.note p,.note li{font-size:12.5px;color:#4E5969}
.note ul{padding-left:16px;margin-top:6px}
.note li{margin-bottom:4px}
.steps{list-style:none;padding:0!important;margin-top:8px}
.steps li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;margin:0}
.steps li i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #C9CDD4;font-style:normal;font-size:11px;display:grid;place-items:center;color:#fff}
.steps li.done i{background:var(--g);border-color:var(--g)}
.steps li.done{color:var(--mut)}
.steps li.next{color:var(--ink);font-weight:600}
.steps li.next i{border-color:var(--g)}

/* phone */
.phone{width:390px;height:812px;background:#fff;border-radius:42px;border:9px solid #1D2129;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(20,30,50,.18)}

.screen.on{display:flex}
.hd{height:46px;flex:none;background:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--line)}
.hd .bk{width:26px;font-size:22px;line-height:1;color:var(--ink)}
.hd .t{flex:1;font-size:16px;font-weight:600;text-align:center}

.body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px}

.card>.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.link{color:var(--blue);font-size:13px;cursor:pointer}

.sm{font-size:12px}
.btn{height:40px;padding:0 18px;border-radius:8px;background:var(--g);color:#fff;font-weight:600}

.btn.grey{background:#F2F3F5;color:var(--ink);font-weight:500}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:6px}

.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#F2F3F5;font-size:12.5px;cursor:pointer;white-space:nowrap}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}

.seg{display:inline-flex;background:#F2F3F5;border-radius:8px;padding:2px}

.lab{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;line-height:18px}
.lab.o{background:var(--orgbg);color:#C66A0C}

.th{flex:none;display:block;width:54px;height:66px;border-radius:6px;background:linear-gradient(160deg,var(--a),var(--b));position:relative;overflow:hidden}

.stat b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--mut)}

function openRemind(){sheet('设置跟进提醒',`<div class="mut sm" style="margin-bottom:6px">客户说了什么（记录需求）</div><textarea class="in" id="rtext" style="height:64px;width:100%;resize:none">客户说过两天再看看，关注米白风衣 M 码</textarea><div class="chips" style="margin:8px 0">${['要比价','等发薪','问家人','要尺码'].map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="mut sm" style="margin-bottom:6px">提醒时间</div><div class="chips">${['明天 10:00','后天 10:00','3 天后 10:00'].map(d=>`<span class="chip ${st.rd===d?'on':''}" data-act="rd" data-arg="${d}">${d}</span>`).join('')}</div>`,'保存',()=>{st.remind=st.rd+' 跟进';st.rnote='客户说过两天再看看，关注米白风衣 M 码';ev('save');render();toast('已记录需求，'+st.rd+'提醒你')})}
function ev(k){ if(!st.scen)return; const s=SCEN[st.scen].steps.find(x=>x.k===k); if(s&&!st.done[k]){st.done[k]=1;} }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)}
function render(){
 const scr=$('#scr'),b=scr.querySelector('.body'),y=b&&scr.dataset.id===st.cur?b.scrollTop:0;
 scr.innerHTML=VIEWS[st.cur](); scr.dataset.id=st.cur;
 const nb=scr.querySelector('.body'); if(nb)nb.scrollTop=y;
 renderNav(); renderNote(); hint();
}
function hint(){
 document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
 if(!st.scen)return; const s=SCEN[st.scen].steps.find(x=>!st.done[x.k]); if(!s)return;
 if(!s.sel)return; const e=$('#scr').querySelector(s.sel)||($('#sheet').classList.contains('on')?$('#sheet').querySelector(s.sel):null); if(e){e.classList.add('hint');}
}
function nav(id,reset){ if(reset)st.hist=[]; else if(st.cur!==id)st.hist.push(st.cur); st.cur=id; render(); }
function back(){ st.cur=st.hist.pop()||'overview'; render(); }
function renderNav(){
 $('#pagenav').innerHTML=PAGES.map(([id,n,tg])=>`<button class="i ${st.cur===id?'on':''}" data-act="page" data-arg="${id}"><span>${n}</span><span class="tg ${tg}">${tg==='new'?'新增':'改造'}</span></button>`).join('')+`<button class="i" data-act="toast" data-arg="经营数据【已有】不改，不在本原型内"><span>经营数据</span><span class="tg old">不改</span></button>`;
 $('#scnav').innerHTML=Object.keys(SCEN).map(k=>{const S=SCEN[k];return (k==='X1'?'<h2 style="margin-top:10px">补充场景（键盘、推送、团队）</h2>':'')+`<button class="sc ${st.scen===k?'on':''}" data-act="scen" data-arg="${k}" id="sc-${k}"><b>${S.title}${S.star?' ★':''}</b><span>${S.short}</span></button>`}).join('');
}
function renderNote(){
 let h='';
 if(st.scen){const S=SCEN[st.scen],nx=S.steps.find(x=>!st.done[x.k]);
  h+=`<h3>${S.title}</h3><p>${S.goal}</p><ul class="steps">${S.steps.map(x=>`<li class="${st.done[x.k]?'done':x===nx?'next':''}"><i>${st.done[x.k]?'✓':''}</i><span>${x.t}</span></li>`).join('')}</ul>${nx?'':'<p style="margin-top:10px;color:#07934B;font-weight:600">这个场景走通了。可以换一个场景，或点左侧页面逐个看。</p>'}${nx&&nx.btn?`<div style="margin-top:10px"><button class="btn sm" id="ffwd" data-act="${nx.btn[0]}">${nx.btn[1]}</button></div>`:''}<div style="margin-top:10px"><button class="btn sm grey" data-act="scen" data-arg="${st.scen}">重新开始</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;}
 const pg=PAGES.find(p=>p[0]===st.cur),nt=NOTES[st.cur];
 if(pg)h+=`<h3>${pg[1]} <span class="tg ${pg[2]}">${pg[2]==='new'?'新增':'改造'}</span></h3><p>${pg[4]}</p><ul><li>入口：${pg[3]}</li><li>对应流程：${pg[5]}</li></ul>`;
 else if(nt)h+=`<h3>${nt[0]} <span class="tg ${nt[1]}">${nt[1]==='new'?'新增':nt[1]==='mod'?'改造':'已有'}</span></h3><p>${nt[2]}</p><ul><li>对应流程：${nt[3]}</li></ul>`;
 else if(st.cur==='detail')h+=`<h3>客户详情 <span class="tg mod">改造</span></h3><p>${PAGES[2][4]}</p><ul><li>对应流程：8、9</li></ul>`;
 if(!st.scen)h=`<p style="margin-bottom:10px;color:#4E5969">先点左侧一个验收场景，右边会一步步带你走。也可以直接点左侧页面逐个看。</p>`+h;
 $('#note').innerHTML=h;
}
function sheet(title,body,label,fn){ setTimeout(hint,0);
 const s=$('#sheet');s.innerHTML=`<div><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b style="font-size:16px">${title}</b><button data-act="closesheet" class="mut">关闭</button></div>${body}<button class="btn" style="width:100%;margin-top:12px" id="sheet-ok">${label}</button></div>`;
 s.classList.add('on'); $('#sheet-ok').onclick=()=>{s.classList.remove('on');fn()};
}
const staffPick=(def)=>`<div id="spick">${['林悦','陈小雨','王浩','张凯'].map(n=>`<div class="opt ${n===def?'on':''}" data-act="spick" data-arg="${n}"><b>${n}</b></div>`).join('')}</div>`;
let picked='林悦';
const ppool=()=>st.pm==='pick'?Object.keys(C).filter(k=>!ORPH.includes(k)):REC.map(x=>x[0]);
function openPm(){
 const o=[['all','全部','所有 229 个客户'],['rec','推荐感兴趣的人','看过、买过的款和新款比较相似的客户，每位带推荐理由'],['pick','指定','手动挑选客户']];
 sheet('推送对象',o.map(([k,t,d])=>`<div class="opt ${st.pmt===k?'on':''}" id="pm-${k}" data-act="pm" data-arg="${k}"><div style="flex:1"><b>${t}</b><div class="sm mut">${d}</div></div><span class="cb ${st.pmt===k?'on':''}">${st.pmt===k?'✓':''}</span></div>`).join(''),'确定',()=>{
  const ch=st.pmt!==st.pm;st.pm=st.pmt;if(ch)st.psel={};
  if(st.pm==='all'){render();return}
  ev('pmrec'+(st.pm==='rec'?'':'x'));nav('pushcust')});
}
function openAssign(){
 const ks=Object.keys(st.sel).filter(k=>st.sel[k]),n=ks.length,own=st.amode==='own';
 const by={};ks.forEach(k=>{const o=C[k].o;by[o]=(by[o]||0)+1});
 const nob=by['无归属']||0;delete by['无归属'];
 const sum=Object.entries(by).map(([o,x])=>o+' '+x+' 位').join('、');
 const chip=(g,a,t)=>`<span class="chip ${st[g]===a?'on':''}" id="${g}-${a}" data-act="${g}" data-arg="${a}">${t}</span>`;
 const body=`<div class="mut sm" style="margin-bottom:6px">${n} 位客户</div><div class="mut sm" style="margin-bottom:6px">任务类型</div><div class="chips" style="margin-bottom:12px">${chip('atype','跟进','跟进')}${chip('atype','群发','群发')}</div><div class="mut sm" style="margin-bottom:6px">执行人</div><div class="chips" style="margin-bottom:10px">${chip('amode','own','按客户归属分配')}${chip('amode','pick','指定员工')}</div>`
  +(own?`<div style="background:#F5F6F8;border-radius:8px;padding:10px;font-size:13px;line-height:1.6">每位客户交给自己的归属导购，各自收到一条任务。<br><b>${sum||'暂无'}</b>${nob?`<br><span style="color:var(--red)">另有 ${nob} 位没有归属导购，请改用“指定员工”</span>`:''}</div>`:staffPick(picked));
 sheet('分配任务',body,'确认发布',()=>{ev('pub');const who=own?(sum||'归属导购'):picked;TASKS.unshift({t:st.atype,name:(st.cf==='全部'?'':st.cf+' · ')+'店长分配',sub:n+' 位客户 · '+(own?'按归属分配 '+Object.keys(by).join('、'):'执行人 '+picked)+' · 刚创建',p:[0,n],m:[0,0,0,0,'¥0'],new:1});st.batch=false;st.sel={};st.tf='全部';st.ttab='团队';toast(own?'已发布，各归属导购收到待办':'已发布，'+picked+' 收到待办');nav('tasks')});
}
const A={
 recpage:()=>{ev('recpage');nav('rec')},rsel:a=>{st.rsel[a]=!st.rsel[a];render()},rall:()=>{const ks=['A102','C201','B015','D088','E033','C305','F012','G220','H118'];const all=ks.every(k=>st.rsel[k]);ks.forEach(k=>st.rsel[k]=!all);render()},rsend:()=>{if(!Object.values(st.rsel).some(Boolean)){toast('先勾选要推荐的款');return}ev('rsend');st.fdone[st.cid||'c1']=1;toast('已进入微信发送，记入跟进记录，今日待办已处理');nav('overview',1)},
 kbgrid:()=>{st.kb='grid';ev('kbgrid');render()},kbback:()=>{st.kb=st.kid?'card':'search';st.gsel={};render()},kbbench:()=>{st.kb='bench';render()},kbflist:()=>{st.kb='flist';render()},kbclose:()=>{st.kb=st.kid?'card':'search';render()},gsel:a=>{st.gsel[a]=!st.gsel[a];if(st.gsel[a])ev('gsel');render()},sendset:()=>{const n=Object.values(st.gsel).filter(Boolean).length;if(!n)return;st.sentSet=n;st.kb='card';st.gsel={};ev('sendset');render();toast('已发合集，记入跟进记录')},dist:a=>{st.dist=a;render()},
 back,stop(){},toast:a=>toast(a),
 page:a=>{st.scen=null;st.done={};nav(a,1)},
 home:()=>{nav('overview',1)},
 scen:a=>{const S=SCEN[a];st.chat=S.chat||'c1';st.msg=S.msg||'';st.remind=a==='S6'?'':'明天 10:00 跟进';st.rnote='';st.rd='后天 10:00';st.fdone={};st.due=0;st.urged={};st.cf='全部';st.batch=false;st.sel={};st.alay=null;st.aemp=null;st.gsel={};st.sentSet=0;st.rsel={A102:1,C201:1,B015:1,D088:1,E033:1};st.need={风格:'通勤',尺码:'M',预算:'500-1000'};ORPH.forEach(k=>C[k].o='无归属');TASKS.length=0;TASKS.push(...TASKS0);st.scen=a;st.done={};st.seg='mine';st.per='today';st.kb='search';st.kid=0;st.sent=false;st.color=null;st.fromChat=false;st.psel={};st.pm='all';st.pmt='all';st.dtab='全部';st.sort={};st.pn='';st.pprod=null;st.uSel={};st.uBatch=false;nav(SCEN[a].start,1)},
 seg:a=>{st.seg=a;if(a==='team')ev('team');render()},
 per:a=>{st.per=a;if(a==='week')ev('week');render()},
 opp:a=>{st.tf='跟进';nav('tasks')},
 emp:a=>{if(a==='张凯'){ev('emp');nav('team')}else toast(a+' 的明细：含未跟进客户列表')},
 ubatch:()=>{st.uBatch=!st.uBatch;st.uSel={};render()},
 usel:a=>{st.uSel[a]=!st.uSel[a];render()},
 remind:()=>{ev('act');toast('已提醒张凯跟进 8 位客户');render()},
 reassign:a=>{picked='林悦';sheet(a==='batch'?'批量重新分配':'转派给',staffPick('林悦'),'确认',()=>{ev('act');st.uBatch=false;st.uSel={};toast('已转派，客户和未完成任务一起转移');render()})},
 spick:a=>{picked=a;document.querySelectorAll('#spick .opt').forEach(e=>e.classList.toggle('on',e.textContent===a))},
 closesheet:()=>$('#sheet').classList.remove('on'),
 cf:a=>{st.cf=a;ev('cf:'+a);render()},batch:()=>{st.batch=!st.batch;st.sel={};if(st.batch)ev('batch');render()},sel:a=>{st.sel[a]=!st.sel[a];if(st.sel[a])ev('csel');render()},
 assign:()=>{ev('assign');picked='林悦';st.atype='跟进';st.amode='own';openAssign()},
 amode:a=>{st.amode=a;openAssign()},
 assign1:()=>sheet('创建跟进任务','<div class="mut sm" style="margin-bottom:6px">执行人</div>'+staffPick('林悦'),'确认发布',()=>toast('已创建，进入待办')),
 ttab:a=>{st.ttab=a;render()},tf:a=>{st.tf=a;render()},
 newtask:()=>sheet('新建任务','<div class="opt on"><b>发圈</b><span class="sm mut">已有</span></div><div class="opt"><b>群发</b><span class="sm mut">新增 · 半自动发送</span></div><div class="opt"><b>跟进</b><span class="sm mut">新增 · 以客户为单位</span></div><div class="sm mut">自动创建在基础设置按机会类型开关</div>','下一步',()=>toast('设置主题、内容、客户范围、时段，再分配执行人')),
 ptab:a=>{st.ptab=a;render()},pper:a=>{st.pper=a;render()},
 auto:a=>{st.auto[a]=st.auto[a]?0:1;render()},
 recent:()=>{st.fromChat=st.cur==='chat';st.pn='';ev('recent');nav('product')},
 wardrobe:()=>{ev('wardrobe');nav('wardrobe')},wprod:a=>{ev('wprod');st.fromChat=true;st.pn=a==='经典双排扣风衣'?'':a;nav('product')},
 dtab:a=>{st.dtab=a;ev('dtab:'+a);render()},prod:a=>{st.fromChat=false;st.pn=a;ev('prod');nav('product')},order:a=>{st.oid=a;ev('order');nav('order')},
 kbpick:()=>{ev('kbpick');if(CHAT[st.chat].nw&&!st.kid){openCreate();return}st.kb='card';st.kid=1;render()},need:a=>{const [g,v]=a.split('|');st.need[g]=v;openCreate()},kbremind:()=>{ev('remind');openRemind()},rd:a=>{st.rd=a;openRemind()},
 ffwd:()=>{st.due=1;ev('ffwd');st.seg='mine';toast('已到后天 10:00，收到跟进提醒');nav('overview',1)},
 od:()=>{ev('od');nav('overdue')},orph:()=>{ev('orph');st.cf='无人跟进';nav('customers')},urge:a=>{st.urged[a]=1;ev('urge');toast('已提醒'+ODT[a][0]+'：'+ODT[a][1]);render()},urgeall:()=>{ODT.forEach((o,i)=>st.urged[i]=1);ev('urge');toast('已催办全部 '+ODT.length+' 项');render()},
 orphopen:()=>{ev('orphopen');picked='林悦';sheet('分配给导购',staffPick('林悦'),'确认分配',()=>{ORPH.forEach(k=>C[k].o=picked);ev('orphdone');toast(ORPH.length+' 位客户已分配给'+picked+'，并生成跟进任务');render()})},
 csall:()=>{const l=custList();const all=l.every(([k])=>st.sel[k]);l.forEach(([k])=>st.sel[k]=!all);if(!all)ev('csel');render()},atype:a=>{st.atype=a;openAssign()},
 sort:a=>{const [k,i]=a.split('|'),c=+i,o=st.sort[k];st.sort[k]=o&&o[0]===c?(o[1]===-1?[c,1]:[-1,0]):[c,-1];ev('sort:'+k);render()},
 alay:a=>{st.alay=a;ev('alay');render()},aemp:a=>{st.aemp=a;ev('aemp');render()},
 care:()=>{ev('care');const c=C[st.cid||'c1'];picked='';sheet('发关怀问候',`<div class="mut sm" style="margin-bottom:6px">话术（来自话术库 · 节点关怀）</div><div style="background:#F5F6F8;border-radius:8px;padding:10px;font-size:14px;line-height:1.6;margin-bottom:10px">${c.n[0]}姐，提前祝你生日快乐！给你备了一张生日券，下次到店或在小程序下单直接用～</div><div class="row" style="padding:6px 0"><div class="m"><b style="font-size:14px">附带生日券 ¥30</b><div>发卡券是现有功能</div></div><div class="sw on" role="switch" aria-checked="true"></div></div>`,'确认并去微信',()=>{ev('carego');st.fdone[st.cid||'c1']=1;toast('已进入微信发送，记入跟进记录');nav('overview',1)})},

 color:a=>{st.color=a;ev('color');render()},
 send:()=>{st.sent=true;st.kb='card';ev('send');st.hist=[];st.cur='chat';render();toast('已发送，记入跟进记录')},
 push:()=>{ev('push');st.pprod=NEW[0];st.pm='all';st.psel={};nav('pushpick')},aud:()=>{ev('aud');st.pmt=st.pm;openPm()},
 pm:a=>{st.pmt=a;ev('pmsel:'+a);openPm()},
 pushnow:()=>{if(st.pm!=='all'&&!Object.values(st.psel).some(Boolean)){toast('先点“推送对象”，选择要推送的客户');return}ev('send');nav('pushconfirm')},
 pickprod:a=>{st.pprod=NEW[a];st.psel={};st.pm='rec';ev('pickprod');nav('pushcust')},
 pushcoat:()=>{st.pprod=COAT;st.psel={};st.pm='rec';nav('pushcust')},

 gen:()=>{ev('gen');if(st.hist[st.hist.length-1]==='pushpick')back();else nav('pushconfirm')},
 ttype:a=>{st.ttype=a;render()},
 confirm:()=>{ev('confirm');const p=st.pprod||COAT,n=st.pm==='all'?229:Object.values(st.psel).filter(Boolean).length;TASKS.unshift({t:st.ttype,name:p.n+' · 推给'+(st.pm==='all'?'全部客户':'老客'),sub:n+' 位客户 · 刚创建',p:[0,n],m:[0,0,0,0,'¥0'],new:1});nav('wechat')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act],[data-go]'); if(!el)return;
 const act=el.dataset.act,g=el.dataset.go;
 if(act&&A[act])A[act](el.dataset.arg);
 if(g){ev('go:'+g);const [id,arg]=g.split(':');if(arg)st.cid=arg;if(id==='tasks')st.tf='全部';nav(id)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('sw')){e.preventDefault();e.target.click()}});
$('#phone').addEventListener('click',()=>{});
render();
