<style>
:root{--g:#07C160;--g2:#E7F8EF;--ink:#1D2129;--mut:#86909C;--line:#EEF0F3;--bg:#F5F6F8;--blue:#2A5DA8;--org:#F58A1F;--orgbg:#FFF3E5;--red:#E5484D;--redbg:#FDECEC;--pur:#7556C2;--purbg:#F1EAFB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:#E8EBEF;color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{display:grid;grid-template-columns:230px 410px minmax(260px,330px);gap:28px;justify-content:center;padding:24px 20px;min-height:100vh;align-items:start}
@media(max-width:1060px){.app{grid-template-columns:1fr;justify-items:center}}

/* side panels */
.nav,.note{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
.nav h1{font-size:17px;margin-bottom:4px}
.nav .sub{color:var(--mut);font-size:12px;margin-bottom:16px}
.nav h2,.note h2{font-size:12px;color:var(--mut);font-weight:500;margin:16px 0 6px}
.nav button.i{display:flex;width:100%;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.nav button.i:hover{background:#DDE1E6}
.nav button.i.on{background:#fff;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.nav .sc{display:block;width:100%;text-align:left;padding:10px;border-radius:10px;background:#fff;margin-bottom:8px;border:1px solid transparent}
.nav .sc.on{border-color:var(--g)}
.nav .sc b{display:block;font-size:13px}
.nav .sc span{font-size:12px;color:var(--mut)}
.tg{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:500;white-space:nowrap}
.tg.new{background:var(--g2);color:#07934B}
.tg.mod{background:var(--orgbg);color:#C66A0C}
.tg.old{background:#ECEEF1;color:#6B7480}
.note{background:#fff;border-radius:14px;padding:16px}
.note h3{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.note p,.note li{font-size:12.5px;color:#4E5969}
.note ul{padding-left:16px;margin-top:6px}
.note li{margin-bottom:4px}
.steps{list-style:none;padding:0!important;margin-top:8px}
.steps li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;margin:0}
.steps li i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #C9CDD4;font-style:normal;font-size:11px;display:grid;place-items:center;color:#fff}
.steps li.done i{background:var(--g);border-color:var(--g)}
.steps li.done{color:var(--mut)}
.steps li.next{color:var(--ink);font-weight:600}
.steps li.next i{border-color:var(--g)}

/* phone */
.phone{width:390px;height:812px;background:#fff;border-radius:42px;border:9px solid #1D2129;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(20,30,50,.18)}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 4px;font-size:12px;font-weight:600;background:#fff}
.screen{display:none;flex:1;min-height:0;flex-direction:column;background:var(--bg);position:relative}
.screen.on{display:flex}
.hd{height:46px;flex:none;background:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--line)}
.hd .bk{width:26px;font-size:22px;line-height:1;color:var(--ink)}
.hd .t{flex:1;font-size:16px;font-weight:600;text-align:center}
.hd .r{min-width:26px;text-align:right;font-size:13px}
.hd.left .t{text-align:left}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 20px}
.body::-webkit-scrollbar{width:0}
.foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.card>.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card>.ch b{font-size:15px}
.link{color:var(--blue);font-size:13px;cursor:pointer}
.mut{color:var(--mut)}
.sm{font-size:12px}
.btn{height:40px;padding:0 18px;border-radius:8px;background:var(--g);color:#fff;font-weight:600}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.grey{background:#F2F3F5;color:var(--ink);font-weight:500}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:6px}
.btn.block{flex:1}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#F2F3F5;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g2);color:#07934B;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{height:0}
.crow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #F0F1F3;cursor:pointer}.crow:last-child{border-bottom:0}
.fchip{display:flex;align-items:center;justify-content:center;gap:4px;min-height:34px;padding:4px 6px;border-radius:17px;background:#F4F5F7;border:1px solid transparent;font-size:12px;color:#1D2129;text-align:center;cursor:pointer}.fchip.on{background:#E6F7ED;border-color:#07C160;color:#07934B;font-weight:600}
.seg{display:inline-flex;background:#F2F3F5;border-radius:8px;padding:2px}
.seg button{padding:3px 12px;border-radius:6px;font-size:13px;color:#4E5969}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ai{display:inline-block;background:var(--pur);color:#fff;font-size:10.5px;font-weight:700;border-radius:8px;padding:0 6px;line-height:16px;vertical-align:middle}
.lab{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;line-height:18px}
.lab.o{background:var(--orgbg);color:#C66A0C}
.lab.g{background:var(--g2);color:#07934B}
.lab.r{background:var(--redbg);color:var(--red)}
.lab.b{background:#E8F0FB;color:var(--blue)}
.lab.n{background:#F2F3F5;color:#6B7480}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px}
.th{flex:none;display:block;width:54px;height:66px;border-radius:6px;background:linear-gradient(160deg,var(--a),var(--b));position:relative;overflow:hidden}
.th::after{content:"";position:absolute;left:50%;bottom:-6px;width:60%;height:70%;transform:translateX(-50%);border-radius:40% 40% 8px 8px;background:rgba(255,255,255,.28)}
.th.l{width:100%;height:130px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .m b{font-size:14.5px}
.row .m div{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.click{cursor:pointer}
.cb{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #C9CDD4;display:grid;place-items:center;color:#fff;font-size:12px;cursor:pointer}
.cb.on{background:var(--g);border-color:var(--g)}
.sw{flex:none;width:42px;height:24px;border-radius:12px;background:#C9CDD4;position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--g)}.sw.on::after{left:20px}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat{text-align:center;cursor:pointer}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--mut)}
.opp{background:#F8FAF9;border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;border:1px solid transparent}
.opp b{display:block;font-size:20px;color:var(--org);line-height:1.2}
.opp span{font-size:11.5px;color:#4E5969}
.opp:hover{border-color:var(--g)}
.bar{height:8px;background:#EEF0F3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.bar.o i{background:var(--org)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--mut);text-align:right;padding:4px 0;font-size:12px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{text-align:right;padding:10px 0;border-top:1px solid var(--line)}
table.t tr.click{cursor:pointer}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(8px);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px}
input.in,textarea.in{width:100%;border:0;background:#F2F3F5;border-radius:8px;padding:9px 12px;font:inherit;outline:none}
.fld{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:12px}
.fld>span:first-child{width:78px;flex:none}
.fld input{flex:1;border:0;outline:none;font:inherit;text-align:left;background:none}
.hint{position:relative;outline:2px solid var(--g);outline-offset:2px;border-radius:8px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{outline-color:rgba(7,193,96,.2)}}
@media(prefers-reduced-motion:reduce){.hint{animation:none}}
button:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.keys{flex:none;background:#D1D4DB;padding:6px 4px 10px;display:grid;gap:6px}
.keys div{display:flex;gap:5px;justify-content:center}
.keys i{flex:1;max-width:32px;height:34px;background:#fff;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.bub{max-width:76%;padding:9px 12px;border-radius:8px;background:#fff;font-size:14px}
.bub.me{background:#95EC69;margin-left:auto}
.kpanel{flex:none;background:#F5F6F8;padding:8px 10px 6px;border-top:1px solid #E2E4E8}
.kcard{background:#fff;border-radius:10px;padding:10px;margin-top:8px}
.kline{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.kline:first-of-type{border-top:0}
.kact{display:flex;gap:6px;margin-top:8px}
.kact button{flex:1;height:30px;border-radius:6px;background:#F2F3F5;font-size:13px}
</style>
</head>
<style>
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:42px;color:#4E5969;position:relative}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:35%;right:35%;bottom:0;height:3px;border-radius:2px;background:var(--g)}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--g);background:var(--g2)}
.opt.out{opacity:.5;cursor:not-allowed}
.sq{width:36px;height:36px;border-radius:10px;background:var(--g2);color:#07934B;display:grid;place-items:center;font-weight:700;font-size:15px}
.qa{text-align:center;cursor:pointer;font-size:12.5px}
.qa .sq{margin:0 auto 4px;width:42px;height:42px}
.dl{font-size:11px}.dl.up{color:#07934B}.dl.dn{color:var(--red)}
.fun{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.fun .n{width:72px;flex:none}.fun .v{width:84px;flex:none;text-align:right;color:var(--mut)}
.fun .bar{flex:1}
.disabled{opacity:.4;pointer-events:none}
.legend{font-size:12px;color:var(--mut)}
.wxh{background:#EDEDED}
</style>

<script>
/* ===== 平铺图：按验收场景回放，每步一屏，帧间箭头标操作 ===== */
const BOARD_SCENES=['S1','S2','S5','S7','S8','S9','X2','X3','X4','X5','X6'];
const CHAT_KB={idle:'输入法',search:'识别客户',card:'客户卡',grid:'去推Ta喜欢',ward:'她的衣橱',prod:'商品',bench:'工作台',flist:'今日跟进客户'};
const EXTRA_NAME={chat:'微信聊天',pushdone:'推送成功',pushpick:'推送上新',overdue:'逾期任务',team:'未跟进客户'};
const WARN=[];
function pageName(){
 if(st.cur==='chat')return '微信聊天 · '+(CHAT_KB[st.kb]||'输入法');
 const p=PAGES.find(x=>x[0]===st.cur);if(p)return p[1];
 if(NOTES[st.cur])return NOTES[st.cur][0];
 return EXTRA_NAME[st.cur]||st.cur;
}
function snap(){
 const scr=$('#scr').cloneNode(true);
 scr.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
 const sh=$('#sheet'),open=sh.classList.contains('on');
 const t=$('#toast'),tOn=t.classList.contains('on');
 let name=pageName();
 const qm=$('#phone>#qrmask');if(qm)name+=' · 扫码弹窗';
 if(open){const m=sh.innerHTML.match(/<b[^>]*>(.*?)<\/b>/);if(m)name+=' · '+m[1].replace(/<[^>]+>/g,'')}
 return {html:scr.innerHTML,sheet:open?sh.innerHTML:'',toast:tOn?t.textContent:'',name,mask:qm?qm.outerHTML:''};
}
function findEl(sel){
 const sh=$('#sheet');
 if(sh.classList.contains('on')){const e=sh.querySelector(sel);if(e)return e}
 const qm=$('#phone>#qrmask');if(qm){const e=qm.querySelector(sel);if(e)return e}
 return $('#scr').querySelector(sel);
}
function runStep(sid,s){
 const t=$('#toast');t.classList.remove('on');clearTimeout(toast.h);
 if(s.btn){A[s.btn[0]]();return}
 let e=findEl(s.sel);
 /* 步骤里写了“返回”的，当前页找不到入口时先退回上一页 */
 if(!e&&!$('#sheet').classList.contains('on')&&st.hist.length){A.back();e=findEl(s.sel)}
 if(!e){WARN.push(sid+'：找不到 '+s.sel);return}
 e.click();
}
function replay(sid){
 const S=SCEN[sid];
 $('#sheet').classList.remove('on');
 A.scen(sid);
 const frames=[Object.assign(snap(),{label:''})];
 S.steps.forEach(s=>{
  if(!s.btn&&!findEl(s.sel)&&!$('#sheet').classList.contains('on')&&st.hist.length){
   /* 当前页没有入口，要先返回上一页：返回本身也画成一帧 */
   $('#toast').classList.remove('on');A.back();
   const b=snap(),pl=frames[frames.length-1];
   if(!(b.html===pl.html&&b.sheet===pl.sheet&&b.mask===pl.mask))frames.push(Object.assign(b,{label:'返回上一页'}));
  }
  runStep(sid,s);
  const f=snap(),last=frames[frames.length-1];
  if(f.html===last.html&&f.sheet===last.sheet&&f.toast===last.toast&&f.mask===last.mask){if(frames.length>1)last.label+='；'+s.t;return}
  f.label=s.t;
  frames.push(f);
 });
 return {sid,S,frames};
}
function phoneHTML(f){
 return `<div class="phone"><div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div><div class="screen on">${f.html}</div>${f.mask||''}${f.sheet?`<div class="sheet on">${f.sheet}</div>`:''}${f.toast?`<div class="toast on">${f.toast}</div>`:''}</div>`;
}
function buildBoard(){
 let h='';
 BOARD_SCENES.forEach(sid=>{
  const r=replay(sid),S=r.S;
  h+=`<section class="scene" id="scene-${sid}"><div class="banner">${S.title}${S.star?' ★':''}</div><p class="goal">${S.goal}</p><div class="row chain">`;
  r.frames.forEach((f,i)=>{
   if(i)h+=`<div class="ar"><span class="lb">${f.label}</span><i></i></div>`;
   h+=`<div class="fr"><div class="ct">${f.name}</div>${phoneHTML(f)}</div>`;
  });
  h+='</div></section>';
 });
 return h;
}
if(!window.__TEST){
 const board=document.getElementById('board');
 board.innerHTML=buildBoard();
 if(WARN.length){console.warn(WARN.join('\n'));board.insertAdjacentHTML('afterbegin','<div style="background:#FFECE8;color:#C0341D;padding:8px 14px;border-radius:8px;margin-bottom:16px;font-size:14px">回放时有 '+WARN.length+' 步没找到点击位置：'+WARN.join('；')+'</div>')}
 document.getElementById('jump').innerHTML=BOARD_SCENES.map(k=>`<a href="#scene-${k}">${k}</a>`).join('');
 board.querySelectorAll('.phone').forEach(ph=>{const b=ph.querySelector('.screen > .body');if(b&&!ph.querySelector('.sheet')&&b.scrollHeight>b.clientHeight+4){ph.style.height=Math.min(ph.offsetHeight+(b.scrollHeight-b.clientHeight)+6,1500)+'px'}});
 board.addEventListener('click',e=>{e.stopPropagation();e.preventDefault()},true);
 let z=.5;const zz=d=>{z=Math.max(.25,Math.min(1,+(z+d).toFixed(2)));board.style.zoom=z;document.getElementById('zv').textContent=Math.round(z*100)+'%'};
 document.getElementById('zi').onclick=()=>zz(.05);document.getElementById('zo').onclick=()=>zz(-.05);zz(0);
}

</script>
